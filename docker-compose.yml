# Local development only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pismo
      POSTGRES_PASSWORD: pismo
      POSTGRES_DB: pismo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pismo -d pismo"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    image: pismo:local
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: "postgres://pismo:pismo@postgres:5432/pismo?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: pismo:local
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://pismo:pismo@postgres:5432/pismo?sslmode=disable"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    ports:
      - "8080:8080"
